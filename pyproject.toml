[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitcraft"
version = "1.0.0"
description = "Generate readable changelogs from Git history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GhosTnever" }]
keywords = ["changelog", "conventional-commits", "git", "release-notes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
commitcraft = "commitcraft.cli:main"

[tool.setuptools]
packages = ["commitcraft"]
