[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitcraft"
version = "1.0.4"
description = "Generate readable changelogs from Git history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GhosTnever" }]
keywords = ["changelog", "conventional-commits", "git", "release-notes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16.10", "mypy>=1.10"]

[project.scripts]
commitcraft = "commitcraft.cli:main"

[tool.setuptools]
packages = ["commitcraft"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
